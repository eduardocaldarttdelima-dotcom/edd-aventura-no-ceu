 .online{margin-top:18px;padding-top:16px;border-top:1px solid #ffffff24}.online label{font-size:12px;color:#d6def4;font-weight:800;display:block;margin-bottom:8px}.online-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.online button,.online input{border:1px solid #607092;border-radius:11px;padding:10px 12px;font:800 13px Nunito,system-ui}.online button{background:#2f4066;color:white;cursor:pointer}.online input{width:130px;background:#fff;color:#17213d;text-transform:uppercase;text-align:center;letter-spacing:.1em}.room{display:none;margin-top:10px;padding:9px;background:#131d35;border-radius:10px;font-size:12px;color:#d6def4}.room b{color:#ffda4e;letter-spacing:.12em}.room.show{display:block}.status{font-size:12px;color:#ffda4e;margin:9px 0 0;min-height:16px}.customize{margin:15px auto 16px}.nick{width:min(100%,270px);padding:10px 13px;border:1px solid #607092;border-radius:11px;background:#fff;color:#17213d;font:800 14px Nunito,system-ui;text-align:center}.skins{display:flex;gap:8px;justify-content:center;margin-top:10px}.skin-option{min-width:112px;border:1px solid #607092;border-radius:11px;padding:9px 12px;background:#2f4066;color:white;font:900 13px Nunito,system-ui;cursor:pointer}.skin-option.selected{outline:2px solid #ffda4e;border-color:#ffda4e;background:#3b4e78}.skin-option span{font-size:17px;margin-right:5px}
</style></head><body><main class="shell"><header><div class="brand"><div class="badge">E</div><div><div class="eyebrow">Uma aventura de</div><div class="title">Edd no céu</div></div></div><div class="hud"><div class="pill">⭐ <span>ESTRELAS</span><b id="score">0</b></div><div class="pill">🏁 <span>RECORDE</span><b id="best">0</b></div><button class="restart" id="restart" aria-label="Recomeçar">↻</button></div></header><section class="game"><canvas id="game" width="960" height="540" aria-label="Jogo de plataforma Edd no céu"></canvas><div class="overlay" id="overlay"><div class="card"><h1 id="headline">Pronto?</h1><p id="message">Salte pelas nuvens, pegue as estrelas e desvie dos espinhos. Quantas você consegue juntar?</p><div class="customize"><input id="nickname" class="nick" maxlength="16" placeholder="Seu apelido" aria-label="Seu apelido"><div class="skins"><button class="skin-option selected" data-skin="edd"><span>👦</span> Edd</button><button class="skin-option" data-skin="mita"><span>🌀</span> MIta</button></div></div><button class="play" id="play">JOGAR SOZINHO</button><div class="online"><label>OU CHAME ALGUÉM PARA JOGAR ONLINE</label><div class="online-row"><button id="host">CRIAR SALA</button><input id="roomInput" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" placeholder="0000" aria-label="Código de 4 dígitos da sala"><button id="join">ENTRAR</button></div><div class="room" id="roomDisplay">Código para compartilhar: <b id="roomCode"></b> <button id="copy">COPIAR</button></div><div class="status" id="netStatus"></div></div></div></div></section><div class="help"><span><strong>A/D • ←/→</strong> mover &nbsp; <strong>W / ESPAÇO / ↑</strong> pular &nbsp; <strong>2º pulo:</strong> mortal</span><div class="touch"><button id="left">←</button><button id="jump">↑</button><button id="right">→</button></div><span>Feito para Edd ✦</span></div></main>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
(()=>{const c=document.querySelector('#game'),ctx=c.getContext('2d'),W=960,H=540,scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay'),headline=document.querySelector('#headline'),message=document.querySelector('#message'),play=document.querySelector('#play'),netStatus=document.querySelector('#netStatus'),nickInput=document.querySelector('#nickname');let state='ready',score=0,best=+(localStorage.eddBest||0),camera=0,last=0,keys={},particles=[],platforms=[],stars=[],spikes=[],world=0,peer=null,conn=null,remote=null,roomSeed=123456,sendClock=0,rng=Math.random,playerSkin=localStorage.eddSkin||'edd',nickname=localStorage.eddNick||'Edd';const img=src=>{let i=new Image();i.src=src;return i},makePart=(src,x,y,w,h,px,py)=>({img:img(src),x,y,w,h,px,py});const rigs={edd:{w:472,h:671,body:img('edd-body.png'),arms:[makePart('edd-armL.png',0,188,220,286,171,224),makePart('edd-armR.png',349,228,101,162,370,246)],legs:[makePart('edd-legL.png',137,334,238,296,246,359),makePart('edd-legR.png',274,378,184,278,361,395)]},mita:{w:560,h:1558,body:img('mita-body.png'),arms:[makePart('mita-armL.png',74,383,170,419,214,410),makePart('mita-armR.png',330,388,139,417,365,408)],legs:[makePart('mita-legL.png',97,788,187,733,224,806),makePart('mita-legR.png',272,788,175,733,326,806)]}};rigs.edd.scale=103/rigs.edd.h;rigs.mita.scale=103/rigs.mita.h;bestEl.textContent=best;nickInput.value=nickname;document.querySelectorAll('.skin-option').forEach(b=>{b.classList.toggle('selected',b.dataset.skin===playerSkin);b.onclick=()=>{playerSkin=b.dataset.skin;localStorage.eddSkin=playerSkin;document.querySelectorAll('.skin-option').forEach(x=>x.classList.toggle('selected',x===b))}});nickInput.addEventListener('input',()=>{nickname=nickInput.value.trim().slice(0,16)||'Edd';localStorage.eddNick=nickname});
const player={x:110,y:0,vx:0,vy:0,w:48,h:78,ground:false,jumps:0,face:1,walk:0,anim:0,flipTimer:0,flipDirection:1,landTimer:0};
function reset(seed=Date.now()){roomSeed=seed>>>0;let rs=roomSeed;rng=()=>{rs=(rs*1664525+1013904223)>>>0;return rs/4294967296};score=0;scoreEl.textContent=score;world=0;camera=0;player.x=110;player.y=350;player.vx=0;player.vy=0;player.jumps=0;player.anim=0;player.flipTimer=0;player.landTimer=0;particles=[];platforms=[];stars=[];spikes=[];let x=0;for(let i=0;i<120;i++){let w=150+rng()*120,y=425+rng()*70;platforms.push({x,y,w,h:24});if(i>0&&rng()>.25)stars.push({x:x+w*.48,y:y-48,r:12,t:rng()*7,got:false});if(i>1&&rng()>.62)spikes.push({x:x+w*.7,y:y-21,w:28,h:22});x+=w+55+rng()*45}world=x;remote=null;}
function start(seed){reset(seed??((Math.random()*0xffffffff)>>>0));state='playing';overlay.classList.add('hidden');netStatus.textContent=conn?'Conectado! Joguem juntos.':''}function end(){state='over';headline.textContent='Boa tentativa, Edd!';message.innerHTML=`Você juntou <b style="color:#ffda4e">${score} estrelas</b>. Tente de novo e vá ainda mais longe!`;play.textContent='JOGAR DE NOVO';overlay.classList.remove('hidden')}
play.onclick=start;document.querySelector('#restart').onclick=()=>{start()};bestEl.textContent=best;
function setConnection(connection,isHost){conn=connection;connection.on('open',()=>{netStatus.textContent='Conectado! A aventura vai começar…';if(isHost){roomSeed=(Math.random()*0xffffffff)>>>0;connection.send({type:'start',seed:roomSeed});start(roomSeed)}});connection.on('data',data=>{if(data?.type==='start'&&!isHost){start(data.seed)}else if(data?.type==='state'){remote=data;}});connection.on('close',()=>{conn=null;remote=null;netStatus.textContent='A outra pessoa saiu da sala.'});connection.on('error',()=>{netStatus.textContent='A conexão caiu. Confira o código e tente de novo.'})}
document.querySelector('#host').onclick=()=>{if(!window.Peer){netStatus.textContent='Não foi possível carregar o modo online. Confira sua internet.';return}netStatus.textContent='Criando sala…';document.querySelector('#roomDisplay').classList.remove('show');let attempts=0;function makeRoom(){if(peer)peer.destroy();let id=String(1000+Math.floor(Math.random()*9000));peer=new Peer(id);peer.on('open',()=>{document.querySelector('#roomCode').textContent=id;document.querySelector('#roomDisplay').classList.add('show');netStatus.textContent='Sala pronta! Envie o código para outra pessoa.'});peer.on('connection',connection=>setConnection(connection,true));peer.on('error',err=>{if(err.type==='unavailable-id'&&attempts++<8){makeRoom();return}netStatus.textContent='Não foi possível criar a sala. Tente novamente.'})}makeRoom()};
document.querySelector('#join').onclick=()=>{let id=document.querySelector('#roomInput').value.trim();if(!/^\d{4}$/.test(id))return netStatus.textContent='Digite os 4 números do código da sala.';if(!window.Peer)return netStatus.textContent='Não foi possível carregar o modo online. Confira sua internet.';netStatus.textContent='Procurando a sala…';peer=new Peer();peer.on('open',()=>setConnection(peer.connect(id),false));peer.on('error',()=>netStatus.textContent='Sala não encontrada. Confira o código e tente novamente.')};
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.querySelector('#roomCode').textContent);netStatus.textContent='Código copiado! Envie para seu amigo.'}catch{netStatus.textContent='Selecione e copie o código acima.'}};document.querySelector('#roomInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#join').click()});
function jump(){if(state!=='playing')return;if(player.jumps<2){let second=player.jumps===1;player.vy=second?-550:-620;player.jumps++;player.ground=false;if(second){player.flipTimer=.58;player.flipDirection=player.face}burst(player.x+24,player.y+player.h,5,second?'#ffdf63':'#fff0bb')}}
window.addEventListener('keydown',e=>{let field=e.target instanceof HTMLElement&&e.target.closest('input,textarea,[contenteditable="true"]');if(field){if(e.key==='Enter'&&e.target.id==='roomInput')document.querySelector('#join').click();return}if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w','A','D','W'].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if((e.key===' '||e.key==='ArrowUp'||e.key.toLowerCase()==='w')&&!e.repeat)jump();if(state!=='playing'&&(e.key==='Enter'||e.key===' '))start()});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});window.addEventListener('blur',()=>{keys={}});function bind(id,key){const el=document.querySelector(id);el.onpointerdown=e=>{e.preventDefault();keys[key]=true};el.onpointerup=el.onpointerleave=el.onpointercancel=()=>keys[key]=false}bind('#left','arrowleft');bind('#right','arrowright');document.querySelector('#jump').onpointerdown=e=>{e.preventDefault();jump()};
function burst(x,y,n,color){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*150,vy:-Math.random()*160,life:.4+Math.random()*.35,color})}
function roundRect(x,y,w,h,r,fill,stroke,lw=4){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.stroke()}}
function drawPart(part,rig,angle){let w=rig.w*rig.scale,px=(part.px/rig.w)*w-w/2,py=(part.py/rig.h)*103-64;ctx.save();ctx.translate(px,py);ctx.rotate(angle);ctx.drawImage(part.img,(part.x-part.px)*rig.scale,(part.y-part.py)*rig.scale,part.w*rig.scale,part.h*rig.scale);ctx.restore()}
function drawEdd(x,y){let rig=playerSkin==='mita'?rigs.mita:rigs.edd,run=player.ground&&Math.abs(player.vx)>5,phase=Math.sin(player.walk),bob=player.ground?(run?Math.abs(phase)*3:Math.sin(player.anim*2.4)*1.3):0;let spin=player.flipTimer>0?((.58-player.flipTimer)/.58)*Math.PI*2*player.flipDirection:(player.ground?(run?-player.face*.035:0):(player.vy<0?-player.face*.055:player.face*.035));let sx=1,sy=1;if(run){sx=1+Math.sin(player.walk*2)*.035;sy=1-Math.sin(player.walk*2)*.035}else if(player.ground){let breath=Math.sin(player.anim*3)*.018;sx-=breath;sy+=breath}if(player.landTimer>0){let land=Math.min(1,player.landTimer/.14);sx+=.10*land;sy-=.12*land}if(!player.ground&&player.flipTimer<=0)sy+=player.vy<0?.035:-.025;ctx.save();ctx.globalAlpha=player.ground?1:.35;ctx.fillStyle='#263e5c';ctx.beginPath();ctx.ellipse(x+24,y+77,playerSkin==='mita'?14:23,4,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.translate(x+24,y+39+bob);ctx.rotate(spin);ctx.scale(player.face*sx,sy);let idle=Math.sin(player.anim*1.8)*.045,armSwing=run?phase*.12:(!player.ground?-.14:idle),legSwing=run?phase*.15:(!player.ground?(player.vy<0?.10:-.08):idle*.5);drawPart(rig.arms[0],rig,armSwing);drawPart(rig.arms[1],rig,-armSwing);if(rig.body.complete&&rig.body.naturalWidth)ctx.drawImage(rig.body,-rig.w*rig.scale/2,-64,rig.w*rig.scale,103);drawPart(rig.legs[0],rig,-legSwing);drawPart(rig.legs[1],rig,legSwing);ctx.restore()}function background(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#80c8ff');g.addColorStop(1,'#e0f5ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff40';for(let i=0;i<8;i++){let x=((i*181-camera*.16)%(W+170)+W+170)%(W+170)-60,y=75+(i*79%220);ctx.beginPath();ctx.ellipse(x,y,31,12,0,0,7);ctx.ellipse(x+19,y-8,21,15,0,0,7);ctx.ellipse(x+37,y,26,11,0,0,7);ctx.fill()}ctx.fillStyle='#ffffff25';ctx.beginPath();ctx.arc(810,92,39,0,7);ctx.fill()}
function frame(ts){let dt=Math.min((ts-last)/1000||0,.033);last=ts;background();if(state==='playing'){player.anim+=dt;if(player.flipTimer>0)player.flipTimer=Math.max(0,player.flipTimer-dt);if(player.landTimer>0)player.landTimer=Math.max(0,player.landTimer-dt);let dir=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);player.vx=dir*250;if(dir){player.face=dir;player.walk+=dt*12}player.x+=player.vx*dt;player.vy+=1500*dt;let oldY=player.y;player.y+=player.vy*dt;player.ground=false;
for(const p of platforms){if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y+6&&player.y+player.h>=p.y&&player.vy>=0){let impact=player.vy;player.y=p.y-player.h;player.vy=0;player.ground=true;player.jumps=0;if(impact>180)player.landTimer=.14}}
if(player.x<camera+30)player.x=camera+30;if(player.x-camera>450)camera=player.x-450;
for(const s of stars){if(!s.got&&Math.abs(player.x+24-s.x)<29&&Math.abs(player.y+30-s.y)<39){s.got=true;score++;scoreEl.textContent=score;burst(s.x,s.y,10,'#ffcf32');if(score>best){best=score;bestEl.textContent=best;localStorage.eddBest=best}}}
for(const z of spikes){if(player.x+player.w-7>z.x&&player.x+7<z.x+z.w&&player.y+player.h-8>z.y&&player.y+player.h-14<z.y+z.h)end()}
if(player.y>H+120)end();for(let i=platforms.length-1;i>=0;i--)if(platforms[i].x+platforms[i].w<camera-100)platforms.splice(i,1);for(let i=stars.length-1;i>=0;i--)if(stars[i].x<camera-100)stars.splice(i,1);for(let i=spikes.length-1;i>=0;i--)if(spikes[i].x<camera-100)spikes.splice(i,1);if(conn?.open){sendClock+=dt;if(sendClock>.08){sendClock=0;conn.send({type:'state',x:player.x,y:player.y,face:player.face,ground:player.ground,walk:player.walk,anim:player.anim,flipTimer:player.flipTimer,flipDirection:player.flipDirection,vy:player.vy,vx:player.vx,landTimer:player.landTimer,skin:playerSkin,name:nickname})}}}
// cloud ledges
for(const p of platforms){let x=p.x-camera;if(x<-200||x>W+80)continue;ctx.fillStyle='#a3daf3';ctx.fillRect(x,p.y+13,p.w,p.h);ctx.fillStyle='#ffffff';ctx.beginPath();ctx.roundRect(x,p.y,p.w,25,12);ctx.fill();ctx.fillStyle='#d6f2ff';ctx.fillRect(x+8,p.y+19,p.w-16,5)}
for(const z of spikes){let x=z.x-camera;ctx.fillStyle='#eb6b73';ctx.strokeStyle='#a63554';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,z.y+z.h);ctx.lineTo(x+z.w/2,z.y);ctx.lineTo(x+z.w,z.y+z.h);ctx.closePath();ctx.fill();ctx.stroke()}
for(const s of stars){if(s.got)continue;let x=s.x-camera,y=s.y+Math.sin(ts/350+s.t)*5;ctx.save();ctx.translate(x,y);ctx.rotate(ts/1100+s.t);ctx.fillStyle='#ffcc35';ctx.strokeStyle='#fff8d5';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?6:13;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
if(state==='playing'||state==='ready')drawEdd(player.x-camera,player.y);if(remote&&state==='playing'){let face=player.face,ground=player.ground,walk=player.walk,skin=playerSkin,anim=player.anim,flipTimer=player.flipTimer,flipDirection=player.flipDirection,vy=player.vy,vx=player.vx,landTimer=player.landTimer;player.face=remote.face||1;player.ground=!!remote.ground;player.walk=remote.walk||0;playerSkin=remote.skin||'edd';player.anim=remote.anim||0;player.flipTimer=remote.flipTimer||0;player.flipDirection=remote.flipDirection||1;player.vy=remote.vy||0;player.vx=remote.vx||0;player.landTimer=remote.landTimer||0;drawEdd(remote.x-camera,remote.y);player.face=face;player.ground=ground;player.walk=walk;playerSkin=skin;player.anim=anim;player.flipTimer=flipTimer;player.flipDirection=flipDirection;player.vy=vy;player.vx=vx;player.landTimer=landTimer;ctx.fillStyle='#ffffff';ctx.font='900 12px Nunito,system-ui';ctx.textAlign='center';ctx.fillText((remote.name||'Amigo').slice(0,16),remote.x-camera+24,remote.y-8)}if(conn?.open&&state==='playing'){ctx.fillStyle='#263e5c';ctx.font='900 12px Nunito,system-ui';ctx.textAlign='center';ctx.fillText(nickname.slice(0,16),player.x-camera+24,player.y-8)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x-camera,p.y,3,0,7);ctx.fill();ctx.globalAlpha=1;if(p.life<=0)particles.splice(i,1)}
if(state==='playing'){ctx.fillStyle='#263e5c99';ctx.font='900 12px Nunito,system-ui';ctx.textAlign='right';ctx.fillText('CORRA E PEGUE AS ESTRELAS',W-22,30)}requestAnimationFrame(frame)}reset();requestAnimationFrame(frame)})();
</script></body></html>
